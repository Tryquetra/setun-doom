[workspace]
members = [
    ".",
    "crates/setun-ffi",
    "crates/setun-kernel",
]

[package]
name = "setun-doom"
version = "0.1.0"
edition = "2021"
authors = ["Robson Cassiano <https://eu.robsoncassiano.software>"]
license = "MIT"
homepage = "https://eu.robsoncassiano.software"
repository = "https://github.com/Tryquetra/setun-doom"
description = "Balanced Ternary Computer Emulator inspired by Setun (1958) and Setun-70 (1970), scaled to 21-trit architecture for Doom (doomgeneric)"

[features]
default = ["std"]
std = []

[lib]
name = "setun_doom"
crate-type = ["rlib"]

[[bin]]
name = "setun-doom"
path = "src/main.rs"
required-features = ["std"]

[[bin]]
name = "setun-ld"
path = "src/bin/setun_ld.rs"
required-features = ["std"]

[[bin]]
name = "setun-run"
path = "src/bin/setun_run.rs"
required-features = ["std"]

[[bin]]
name = "setun-doom-rv32"
path = "src/bin/setun_doom_rv32.rs"
required-features = ["std"]

[profile.test]
opt-level = 2

[profile.test.package.setun-doom]
opt-level = 3
